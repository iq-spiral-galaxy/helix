<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helix</title>
  <meta name="theme-color" id="theme-color" content="#f7f7f6" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <script src="/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="side-panel" aria-label="Helix 탐색">
      <label class="side-search" for="side-search-input">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="side-search-input" type="search" placeholder="나선 검색…"
          autocomplete="off" spellcheck="false" role="combobox"
          aria-label="나선 검색" aria-autocomplete="list"
          aria-controls="side-list" aria-describedby="side-search-status"
          aria-expanded="false" />
        <kbd>⌘K</kbd>
      </label>
      <nav class="side-nav">
        <a href="#/" data-nav="subjects">나선 일지</a>
        <a href="#/map" data-nav="map">나선 지도</a>
        <a href="#/q" data-nav="questions">열린 질문</a>
        <a href="#/bookmarks" data-nav="bookmarks" id="side-bookmarks">북마크</a>
      </nav>
      <div class="side-search-status" id="side-search-status" role="status" aria-live="polite"></div>
      <div class="side-list" id="side-list" role="listbox" aria-label="나선 검색 결과" hidden></div>
      <button class="side-settings" id="settings-trigger" type="button"
        aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false">
        설정
      </button>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="탐색 닫기" hidden></button>
    <div class="workspace">
      <header class="mobile-topbar">
        <button class="mobile-menu" id="sidebar-toggle" type="button" aria-controls="side-panel" aria-expanded="false">
          <span class="menu-lines" aria-hidden="true"><i></i><i></i></span>
          <span class="sr-only">탐색 열기</span>
        </button>
        <a class="mobile-brand" href="#/" aria-label="Helix 홈">Helix</a>
        <span class="mobile-page" id="mobile-page">나선 일지</span>
        <button class="mobile-search" id="mobile-search" type="button"
          aria-label="나선 검색 열기" aria-controls="side-panel" aria-expanded="false">
          <span aria-hidden="true">⌕</span>
        </button>
      </header>
      <div class="tabbar">
        <button class="tnav sidebar-collapse" id="sidebar-collapse" type="button"
          aria-label="사이드바 닫기" title="사이드바 닫기"
          aria-controls="side-panel" aria-expanded="true">
          <span class="panel-toggle-icon" aria-hidden="true"></span>
        </button>
        <button class="tnav" id="nav-back" aria-label="뒤로" title="뒤로">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="tnav" id="nav-fwd" aria-label="앞으로" title="앞으로">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="tabstrip-scroll">
          <div class="tabs" id="tabs" role="tablist" aria-label="열린 Helix 탭"></div>
          <button class="tnav tab-new" id="tab-new" aria-label="새 탭" title="새 탭">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
          </button>
        </div>
      </div>
      <div class="sr-only" id="route-status" aria-live="polite"></div>
      <main id="app"></main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="주요 화면">
      <a href="#/" data-nav="subjects"><span aria-hidden="true">◉</span><b>일지</b></a>
      <a href="#/map" data-nav="map"><span aria-hidden="true">⌁</span><b>지도</b></a>
      <a href="#/q" data-nav="questions"><span aria-hidden="true">?</span><b>질문</b></a>
      <button id="mobile-bottom-search" type="button"
        aria-controls="side-panel" aria-expanded="false">
        <span aria-hidden="true">⌕</span><b>검색</b>
      </button>
    </nav>
  </div>
  <dialog class="settings-dialog" id="settings-dialog" role="dialog"
    aria-modal="true" aria-labelledby="settings-title">
    <header class="settings-head">
      <h2 id="settings-title">설정</h2>
      <button class="settings-close" id="settings-close" type="button" aria-label="설정 닫기">×</button>
    </header>
    <div class="settings-body">
      <fieldset>
        <legend>테마</legend>
        <div class="theme-options">
          <label class="theme-option">
            <input type="radio" name="helix-theme" value="light" />
            <span class="theme-preview theme-preview-light" aria-hidden="true"><i></i></span>
            <span>라이트</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="helix-theme" value="dark" />
            <span class="theme-preview theme-preview-dark" aria-hidden="true"><i></i></span>
            <span>다크</span>
          </label>
        </div>
      </fieldset>
      <section class="desktop-settings" id="desktop-settings" hidden>
        <header class="desktop-settings-head">
          <h3>데스크톱 앱</h3>
          <span id="desktop-version"></span>
        </header>
        <div class="desktop-update-row">
          <div>
            <strong>앱 업데이트</strong>
            <p id="desktop-update-status" role="status" aria-live="polite">최신 버전을 확인합니다.</p>
          </div>
          <button class="settings-action primary" id="desktop-update-button" type="button">
            업데이트 확인
          </button>
        </div>
        <div class="desktop-data-row">
          <div>
            <strong>데이터 폴더</strong>
            <code id="desktop-data-root"></code>
          </div>
          <div class="desktop-data-actions">
            <button class="settings-action" id="desktop-data-reveal" type="button">열기</button>
            <button class="settings-action" id="desktop-data-change" type="button">변경</button>
          </div>
        </div>
      </section>
    </div>
  </dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
