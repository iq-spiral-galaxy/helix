<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helix</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="side-panel">
      <a class="brand" href="#/">
        <svg class="brand-mark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2.5c0 3.2 8 3.2 8 6.4s-8 3.2-8 6.4c0 1 .8 1.7 2 2.2" />
            <path opacity=".48" d="M14 2.5c0 3.2-8 3.2-8 6.4s8 3.2 8 6.4c0 1-.8 1.7-2 2.2" />
            <path opacity=".25" d="M6.8 5.7h6.4M6.8 12.1h6.4" />
          </g>
        </svg>
        <span class="brand-name">Helix</span>
      </a>
      <button class="side-search" id="search-trigger" type="button" aria-label="검색">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span>검색</span>
        <kbd>⌘K</kbd>
      </button>
      <nav class="side-nav">
        <a href="#/" data-nav="subjects">나선 일지</a>
        <a href="#/map" data-nav="map">나선 지도</a>
        <a href="#/q" data-nav="questions">열린 질문</a>
      </nav>
      <div class="side-list" id="side-list"></div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="나선 목록 닫기" hidden></button>
    <div class="workspace">
      <header class="mobile-topbar">
        <button class="mobile-menu" id="sidebar-toggle" type="button" aria-controls="side-panel" aria-expanded="false">
          <span class="menu-lines" aria-hidden="true"><i></i><i></i></span>
          <span class="sr-only">나선 목록 열기</span>
        </button>
        <a class="mobile-brand" href="#/" aria-label="Helix 홈">Helix</a>
        <span class="mobile-page" id="mobile-page">나선 일지</span>
        <button class="mobile-search" id="mobile-search" type="button" aria-label="전체 검색 열기">
          <span aria-hidden="true">⌕</span>
        </button>
      </header>
      <div class="tabbar">
        <button class="tnav" id="nav-back" aria-label="뒤로" title="뒤로">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="tnav" id="nav-fwd" aria-label="앞으로" title="앞으로">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="tabs" id="tabs" role="tablist" aria-label="열린 Helix 탭"></div>
        <button class="tnav" id="tab-new" aria-label="새 탭" title="새 탭">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="sr-only" id="route-status" aria-live="polite"></div>
      <main id="app"></main>
    </div>
    <nav class="mobile-bottom-nav" aria-label="주요 화면">
      <a href="#/" data-nav="subjects"><span aria-hidden="true">◉</span><b>일지</b></a>
      <a href="#/map" data-nav="map"><span aria-hidden="true">⌁</span><b>지도</b></a>
      <a href="#/q" data-nav="questions"><span aria-hidden="true">?</span><b>질문</b></a>
      <button id="mobile-bottom-search" type="button"><span aria-hidden="true">⌕</span><b>검색</b></button>
    </nav>
  </div>
  <div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
    <div class="search-panel">
      <h2 class="sr-only" id="search-title">Helix 전체 검색</h2>
      <div class="search-head">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="나선 · Layer · 질문 검색…"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-label="Helix 전체 검색어"
          aria-autocomplete="list"
          aria-controls="search-results"
          aria-expanded="false"
        />
        <kbd>esc</kbd>
        <button class="search-close" id="search-close" type="button" aria-label="검색 닫기">×</button>
      </div>
      <div class="search-results" id="search-results" role="listbox" aria-label="검색 결과"></div>
    </div>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
